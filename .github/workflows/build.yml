name: Build

on:
  workflow_dispatch: # allows for manual triggering
  push:
    tags:
      - "v*.*.*"

env:
  # the one place the app's name lives for CI; scripts/build_macos.sh, scripts/build_linux.sh and the assets under assets/ use the same name
  APP_NAME: Dubcrate

jobs:
  test:
    uses: ./.github/workflows/test.yml

  test-macos:
    # the push-time tests are Linux only; a release also runs them on a Mac
    uses: ./.github/workflows/test-macos.yml

  build-macos-arm:
    needs: [test, test-macos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from the nearest git tag
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Cache the ffmpeg build
        # scripts/build_macos.sh builds LGPL ffmpeg and ffprobe once (scripts/build_ffmpeg_macos.sh, a couple of minutes) and bundles them
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_macos.sh') }}
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh scripts/make_icons.sh scripts/build_ffmpeg_macos.sh
          ./scripts/build_macos.sh  # also builds $APP_NAME-macos-{arm,intel}.dmg at the repo root
      - name: Smoke-test the built app
        run: |
          BIN=$(find "src/$APP_NAME.app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x -name 'main*' | head -1)
          echo "Running $BIN"
          QT_QPA_PLATFORM=offscreen "$BIN" --smoke-test=smoke.txt || { cat smoke.txt; exit 1; }
          cat smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-arm
          path: ${{ env.APP_NAME }}-macos-arm.dmg

  build-macos-intel:
    needs: [test, test-macos]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Install nasm
        # ffmpeg's x86 assembly (Intel builds only)
        run: brew install nasm
      - name: Cache the ffmpeg build
        # scripts/build_macos.sh builds LGPL ffmpeg and ffprobe once (scripts/build_ffmpeg_macos.sh, a couple of minutes) and bundles them
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_macos.sh') }}
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh scripts/make_icons.sh scripts/build_ffmpeg_macos.sh
          ./scripts/build_macos.sh  # also builds $APP_NAME-macos-{arm,intel}.dmg at the repo root
      - name: Smoke-test the built app
        run: |
          BIN=$(find "src/$APP_NAME.app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x -name 'main*' | head -1)
          echo "Running $BIN"
          QT_QPA_PLATFORM=offscreen "$BIN" --smoke-test=smoke.txt || { cat smoke.txt; exit 1; }
          cat smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-intel
          path: ${{ env.APP_NAME }}-macos-intel.dmg

  build-linux:
    # the push-time tests already ran on Linux (the `test` job), so this only builds
    needs: [test, test-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Install build tools
        # Nuitka compiles C (build-essential, patchelf); nasm is for ffmpeg's x86 code; the rest are what Qt loads, so the built app
        # can be opened once here (the smoke test)
        run: sudo apt-get update && sudo apt-get install -y build-essential patchelf nasm zip file zlib1g-dev autoconf automake libtool pkg-config qt6-qpa-plugins libegl1 libgl1 libfontconfig1 libnss3 libasound2t64 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcomposite1 libxdamage1 libxi6 libxtst6 fonts-dejavu-core
      - name: Cache the ffmpeg build
        # scripts/build_linux.sh builds LGPL ffmpeg and ffprobe once (scripts/build_ffmpeg_linux.sh, a few minutes) and bundles them
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_linux.sh') }}
      - name: Build
        run: |
          chmod +x scripts/build_linux.sh scripts/build_ffmpeg_linux.sh
          ./scripts/build_linux.sh  # also builds $APP_NAME-linux-x86_64.AppImage and .zip at the repo root
      - name: Smoke-test the built app
        run: |
          echo "Running src/$APP_NAME.dist/main.bin"
          QT_QPA_PLATFORM=offscreen "src/$APP_NAME.dist/main.bin" --smoke-test=smoke.txt || { cat smoke.txt; exit 1; }
          cat smoke.txt
      - name: Smoke-test the AppImage
        run: |
          QT_QPA_PLATFORM=offscreen "./$APP_NAME-linux-x86_64.AppImage" --appimage-extract-and-run --smoke-test=smoke-appimage.txt || { cat smoke-appimage.txt; exit 1; }
          cat smoke-appimage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: ${{ env.APP_NAME }}-linux-x86_64.zip

  build-windows:
    # the push-time tests already ran on Linux (the `test` job), and the macOS ones above; the Windows ones are run by hand
    # (test-windows.yml), so this only builds
    needs: [test, test-macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Set up MSYS2
        # scripts/build_windows.ps1 builds LGPL ffmpeg and ffprobe in it (scripts/build_ffmpeg_windows.sh)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: base-devel diffutils make nasm xz curl gcc autoconf automake libtool pkgconf libiconv-devel gettext-devel mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-pkgconf
      - name: Cache the ffmpeg build
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_windows.sh') }}
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: .\scripts\build_windows.ps1  # also builds $env:APP_NAME-windows-x64-Setup.exe at the repo root
      - name: Smoke-test the built app
        # the built app has no console, so Start-Process waits for it and the report comes from a file
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "src\$env:APP_NAME.dist\main.exe" -ArgumentList "--smoke-test=smoke.txt" -Wait -PassThru
          if (Test-Path smoke.txt) { Get-Content smoke.txt } else { Write-Host "no smoke test report was written" }
          if ($p.ExitCode -ne 0) { throw "smoke test failed (exit code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: ${{ env.APP_NAME }}-windows-x64-Setup.exe

  release:
    needs: [build-macos-arm, build-macos-intel, build-linux, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/**/*
          draft: true # comment this out if u want the release to be auto-published
