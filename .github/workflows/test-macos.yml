name: Test (macOS)

on:
  workflow_dispatch: # by hand only: Actions tab > Test (macOS) > Run workflow
  workflow_call: # build.yml runs this as part of a release

concurrency:
  group: test-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        # reading, probing and converting tracks run ffmpeg and ffprobe
        run: brew install ffmpeg

      - name: Sync environment
        run: uv sync --no-group build
      - name: Run tests
        # the lint is not repeated: it runs on Linux in test.yml and does not depend on the OS
        run: uv run --no-group build pytest tests/ -v -ra -o faulthandler_timeout=90
