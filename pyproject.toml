[project]
name = "dubcrate"
version = "0.1.0"
description = "Burn audio CDs for old-style CDJs from a DJ library"
readme = "README.md"
authors = [
    { name = "Martin Curkovic", email = "martincurkovic@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyobjc-framework-discrecording>=13.0 ; sys_platform == 'darwin'",
]

[project.scripts]
dubcrate = "dubcrate:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
